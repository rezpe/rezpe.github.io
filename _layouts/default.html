<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
    <link rel="alternate" type="application/rss+xml" title="RSS Feed" href="{{ site.url }}/feed.xml">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=typography"></script>
    <script>
        tailwind.config = { theme: { extend: {
            colors: { brand: "#1ba5b8", ink: "#0f1f3d" },
            fontFamily: { sans: ["Plus Jakarta Sans", "sans-serif"] },
        } } }
    </script>
    {% include analytics.html %}
</head>
<body class="relative min-h-screen overflow-x-hidden bg-white text-ink antialiased">
    <div class="pointer-events-none fixed -z-10 -right-60 top-16 h-[44rem] w-[44rem] rounded-full bg-gradient-to-br from-orange-200 via-orange-100 to-sky-100 opacity-70 blur-sm"></div>
    <div class="pointer-events-none fixed -z-10 -left-40 -top-40 h-[30rem] w-[30rem] rounded-full bg-sky-100/60 blur-3xl"></div>

    <header class="sticky top-0 z-50 border-b border-slate-100 bg-white/70 backdrop-blur">
        <div class="mx-auto flex h-16 max-w-5xl items-center justify-between px-6">
            <a href="/" class="flex items-center gap-3 font-semibold">
                <span class="grid h-8 w-8 place-items-center rounded-full bg-brand text-xs text-white">SP</span>Home
            </a>
            <nav class="flex items-center gap-6 text-sm">
                <a href="/#posts" class="hidden hover:text-brand sm:block">Posts</a>
                <a href="/#apps" class="hidden hover:text-brand sm:block">Custom Apps</a>
                <a href="https://www.linkedin.com/in/sebastien-perez-vasseur-76938612/" class="rounded-full bg-brand px-4 py-2 text-white shadow hover:opacity-90">Contact Me</a>
            </nav>
        </div>
    </header>

    <main class="mx-auto max-w-5xl px-6 py-16">{{ content }}</main>

    <footer class="mx-auto flex max-w-5xl items-center justify-between border-t border-slate-100 px-6 py-10 text-xs text-slate-400">
        {% include social.html %}
        <span>© {{ site.time | date: '%Y' }} {{ site.title }}</span>
    </footer>
</body>
</html>
